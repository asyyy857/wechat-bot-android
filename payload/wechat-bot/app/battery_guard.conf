# ============================================================================
#  battery_guard.conf —— 电量看护的配置（battery_guard.sh 每轮都会重读这个文件）
#
#  谁在用：bot.sh start 会把 battery_guard.sh 后台拉起来；机器人跑着的时候，
#  它每隔 CHECK_INTERVAL 秒看一眼手机电量，低于 STOP_BELOW 就把机器人停掉
#  （走 stop.sh：停机器人 + 停桥接 + 把微信搬回物理屏）。
#
#  改完不用重启机器人，最迟 CHECK_INTERVAL 秒生效。
#  看当前状态：bash /sdcard/dsh/wechat-auto/battery_guard.sh --status
#  历史记录：  /tmp/wxbot-battery.log
#
#  ⚠️ 2026-10-07 改（用户「补缺口」）：STOP_BELOW 10 → 20。
#     起因：当天早上约 10% 电量时手机卡死重启 —— 到 10% 才动手已经太晚了。
# ============================================================================

# 电量低于这个百分数就把机器人停掉
STOP_BELOW=20

# 电量低于这个百分数：告警 + 把读屏节奏拉长到 SLOW_INTERVAL（**不停机**）。
# 必须 >= STOP_BELOW；两者相等就等于关掉这一档。
WARN_BELOW=25

# 1 = 插着充电器就不停（推荐：插着电不会把手机耗死，停了反而打断你）
#     也不会降到慢节奏
SKIP_WHEN_CHARGING=1

# 每隔多少秒看一眼电量。
# ★ 2026-10-07 用户：「电量检查没必要这么频繁吧，10 分钟一次半小时一次都可以」
#   → 60 秒改成 **600 秒（10 分钟）**。
#   ⚠️ 代价：低电量停机/降速最多迟 10 分钟才反应（按 13%/小时算约 2% 电量），可接受。
CHECK_INTERVAL=600

# ---- 以下两项 2026-10-07 新增：不想让它自己调节奏就删掉/注释掉 ----

# 低电量（< WARN_BELOW 且没充电）时的读屏间隔（秒）。正常是 15 秒左右。
SLOW_INTERVAL=120

# 用户正占着物理屏微信（连续 YIELD_AFTER 秒）时的读屏间隔（秒）。
# 机器人这时读不到虚拟屏的微信，死磕只是白耗电 + 给系统加负载。
# ⚠️ 2026-10-07 用户要求：**别让太久**，300 → 60（他开微信时仍希望机器人
#    尽量正常跟着，只是别死磕）。
YIELD_INTERVAL=60

# 用户连续用微信多少秒后开始让路。
# ★ 2026-10-07 用户选 C「不再让路」→ 设成 24 小时，**实际等于关闭**。
#   理由（当时跟他对过）：你开微信时机器人本来就读不到虚拟屏的微信（微信只有一个
#   实例，被你拉走了），降频只是少空转；但它的进入/退出都挂在 10 分钟一轮的看护上，
#   反应太迟钝 —— 不如不降，你一放下微信它立刻就正常。
#   ⚠️ 低电量降速（SLOW_INTERVAL）**不受这条影响**，仍然照常工作。
YIELD_AFTER=86400
