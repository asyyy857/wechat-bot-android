# ============================================================================
# ⚠️ 以下配置项**在手机端不生效**（只有 PC 版路径会读，保留是为了兼容 PC）：
#     me.self_x_ratio · debug.frame_dir · safety.hotkey* · behavior.send_key
#     behavior.restore_focus · behavior.stickers.settle · target.window_title
#     persona_probability
#   2026-10-08 审查：它们改了不会有任何效果，别在这里浪费时间调参。
# ----------------------------------------------------------------------------
#  微信自动回复机器人 —— 主配置
#  改完直接重启脚本生效（除了标注"热更新"的项）
# ============================================================================

# ---------------------------------------------------------------- 目标
target:
  # 微信主窗口标题（微信 4.x 是「微信」，老版本是「WeChat」）
  window_title: 微信
  # 只在标题包含这个字符串的会话里工作。填你的群名（或群备注名）。
  # ⚠️ 如果你给群设了**备注**，标题栏显示的是备注名（而不是原群名），
  #   这里就要填备注名。备注会让标题栏变成**两行**（第一行备注+人数、
  #   第二行原群名），两行都会被虚拟屏的窄宽度压扁 —— 实测读到 `缺...10`；
  #   `title_matches` 为此放宽了单字 head 的判据（见 android.py 里那段注释）。
  group: "改成你的群名"

# ---------------------------------------------------------------- 字体适配
# ★ v2.0.0 新增：别人的微信不是"默认字体"（调大了字号 / 换了系统字体）时，
#   读屏的版面参数会失配（漏行、两个气泡粘一起）。这里把「你的微信字体」告诉它。
#   默认 enabled: false —— 关着时行为和旧版**完全一致**。
#
#   三种填法，优先级从高到低（填一个就够）：
#     ① scale     直接给倍数：1.0 = 微信标准字号，1.2 = 放大约 20%
#     ② size_px   正文字号（像素）：scale 自动 = size_px / 64
#     ③ profile   字体档案名：data/font_profiles/<名字>.json
#
#   怎么知道自己该填多少 —— 自动测量（它会读当前屏幕、量出正文行高）：
#       cd /sdcard/dsh/wechat-bot/app
#       python3 -m wxauto.fontprofile --auto --yes
#   然后把 enabled 改成 true，profile 填测出来的名字（或跑 --use <名字>）。
read:
  font:
    enabled: false
    profile: ""            # 字体档案名（存在 data/font_profiles/）
    file: ""               # 你的字体文件路径或字体名（只作记录，不影响 OCR）
    size_px: 0             # 0 = 不用这一项
    scale: 1.0             # 1.0 = 标准字号
    engine: auto           # auto = 现用引擎；v5 = 换更强的 v5-server 兜底

# ---------------------------------------------------------------- 我是谁
me:
  # 你在群里的昵称，用来识别「有人 @我」。
  # 微信 @ 会显示完整群昵称，这里填片段即可（包含匹配）。
  # ★ 必改：填你（机器人用的这个微信号）在群里的昵称。
  nicknames:
    - 改成你在群里的昵称
    # ↓ 机器人的人设是「猫娘」，所以这几个称呼也算在叫它。
    #   不想让它对「猫娘 / 小猫」应声，把下面三行删掉即可。
    - 猫娘
    - 小猫娘
    - 小猫
  # 文本块左边缘超过聊天区宽度的这个比例，就判定为"我发的"
  self_x_ratio: 0.45

# ---------------------------------------------------------------- 深夜定时文案
midnight:
  enabled: true
  # 到点自动发（不需要任何人说话）。每天只发一次，0~10 分钟内没发成会继续等。
  open_text: "深夜了喵 EMO了喵"     # 固定开场
  emo_texts:                        # 接着从下面随机抽一条发
    - "莫名其妙就emo了"
    - "一到这个点就开始想些没用的"
    - "睡不着 也不知道在想什么"
    - "夜里的人最容易想太多"

# ---------------------------------------------------------------- 模型
llm:
  enabled: true
  # DeepSeek 官方接口（OpenAI 兼容）。申请：https://platform.deepseek.com
  base_url: https://api.deepseek.com
  api_key: ""
  api_key_env: DEEPSEEK_API_KEY
  # 也可以填任何 OpenAI 兼容服务，例如：
  #   https://api.siliconflow.cn/v1     （硅基流动）
  #   https://open.bigmodel.cn/api/paas/v4 （智谱）
  model: deepseek-chat
  temperature: 1.0             # ★ 2026-10-10：1.3 → 1.0（用户报"说的话看不懂"）
                              #   1.3 太高 = 采样随机、句子跳跃。降下来更连贯。
  # ★★ 2026-10-10 用户要求「生成话以后自检一下吧」：生成完再让模型单独判一次
  #   「没看过上下文的人能不能看懂」，判不过就带着判词让它重写一次（只重一次）。
  #   实现在 brain.py::compose + check_readable；false = 关掉（回到"写完直接发"）。
  #   代价：每条正常回复多一次模型调用（约 1 秒、几十 token）。
  selfcheck: true
  max_tokens: 500             # 人设要求短句，别给大（**平时闲聊**用这档）
  # ★ 2026-10-09 用户要求「被 @ 时放宽字数」。注意：这是**模型的输出上限**，
  #   中文 1 字约 1.5~2 token，所以 60 只能写出 40~50 字 —— 光调大
  #   behavior.mention_max_chars 是没用的（PPT 点评配的 100 字上限就是
  #   被这里卡死的，从没生效过）。被 @ 时用下面这档。
  mention_max_tokens: 800    # 被 @ 时给模型的空间（约 150~200 字，够展开）
  # ★ 2026-10-09 用户要求：「他如果愿意多说一点就多说一点，但是不能就是说那个
  #   空话重复别人的话……要能引起别人话题继续往下说的那种」。
  #   同一个道理：60 token 只够写一句短评 —— 实测 47 条主动插话平均 **9.8 字**、
  #   最长 14 字，大半是「本喵也喜欢喵」这种接不下去的附和。所以单独给一档。
  proactive_max_tokens: 600  # 主动插话给模型的空间（约 100~130 字）
  # ★ 2026-10-10 识图（群里发的照片）用的**视觉模型**。必须是支持图片输入的：
  #   · deepseek-flash    —— 支持（input_modalities 带 image），当前用这个；
  #   · deepseek-v4-pro / deepseek-chat —— **只吃文字**，配了会直接报错。
  #   查当前账号有哪些：curl https://api.deepseek.com/models -H "Authorization: Bearer $KEY"
  vision_model: deepseek-flash
  # ⚠️ 这一档**不能小**：flash 是推理模型，max_tokens 会先被 reasoning 吃掉
  #   （实测给 120 时正文直接是空的，全用在思考上）。600 起步。
  vision_max_tokens: 600
  # 识图不需要长考（reasoning token 也计费）。留空 = 不带这个参数，
  # 兼容别的 OpenAI 兼容服务（有些服务不认 reasoning_effort）。
  vision_reasoning_effort: low
  # ★ 2026-10-13：文字回复也带推理档（此前只有识图那档带）。
  #   留空 = 不带这个参数（完全不推理、最省，也兼容不认它的 OpenAI 兼容服务）。
  #   传了 = 强制推理，且 reasoning token 会**先吃 max_tokens**（正文可能被挤空）。
  #   取值只有 low / high / max（V4.1-Flash 没有 medium）；high = 认真想。
  reasoning_effort: high
  # ★ 2026-10-13 用户口径：「我要更智能的回复，同时避免不必要的思考，不需要
  #   一个劲省 token」。所以按**场景**分档（大白话：答题前先想几步）：
  #     · reasoning_effort      → 平时接话 / 主动插话
  #     · reasoning_effort_deep → 被 @ 认真答 / 点名问事 / 读 PPT / 读聊天记录
  #     · 判定类（自检 / 选工具）**完全不思考**（不带参数，reasoning=0）
  reasoning_effort_deep: high
  # 单张图最大多少字节（超过就不发，防止把大图塞进请求）
  vision_max_bytes: 1500000
  timeout: 30
  # 每次只把最近这么多条消息喂给模型（省 Token 的核心）
  # ★ 2026-10-11：8 → 16。用户要求「根据上下文回复」—— 群里的话是上下关联的，
  #   8 条在热闹的群里只够两三句来回。
  context_messages: 16
  # 单条上下文最多保留多少字（60 → 80）
  context_max_chars: 80
  # ★ 2026-10-11：上下文只取最近这么多**秒**内的消息 ——
  #   免得半夜冷场时把一小时前那句当成"现在正在聊的"。
  context_window_secs: 600

# ---------------------------------------------------------------- 频率（风控核心）
pace:
  # ⚠️ 2026-10-10 评审：本段的 poll_interval / reply_delay **会被 tuning.json 覆盖**
  #    （控制面板的「读屏节奏」卡片写的就是它；`bot.py::_apply_tuning` 启动时套用、
  #    每轮看它的 mtime）。tuning.json 里**没写**的项才回落到这里。
  #    启动日志里那行「运行时调参已套用（tuning.json 优先于 config.yaml）：…」
  #    才是实际生效值 —— 直接看那个，别只看这个文件。
  # 2026-10-04 用户因耗电一路下调：2.5 → 5 → 10 → 20 秒。读屏桥（screencap+RapidOCR）
  # 实测常驻 2.6~2.9 个 CPU 核，是手机上最大的耗电来源（DSH 占 73%，微信仅 14%）。
  # 用户原话：不需要那么快，也不需要每条消息都回复。
  # ★ 2026-10-09 用户说「是不是太慢了」→ 拍板调快一档：20 → **10** 秒。
  #   端到端里它是最大的一块（发现消息本身就要等 0~20 秒，平均 10 秒），
  #   代价是读屏耗电大约翻倍 —— 嫌费电就改回 20。
  poll_interval: 10           # 白天的轮询间隔（秒）。OCR 一帧约 0.6s，别调太小

  # ★ 2026-10-10：自适应读屏节奏 —— 群里**爆发**时全速读，**安静下来**逐步放慢省电。
  #   用户原话：「群里的聊天记录是爆发式的，机器人读平时一直 10 秒……能不能改？
  #   一下有人发消息他就开始增大频率，然后没人了再慢慢把频率降下来。」
  #   规则：上一轮读到**新消息** → 这一轮立刻回到全速（几乎不再等）；
  #         连续 idle_step_rounds 轮一条新消息都没有 → 往上爬一档，直到最后一档。
  #   ⚠️ 放慢是拿「漏消息」换电 —— 机器人只看得见当前那一帧，间隔里刷过去的消息它
  #      永远看不到。所以最后一档的秒数就是"安静时有人开口，最坏多久才发现"。
  #   ⚠️ 提速有物理上限：full 档一轮读屏（截图 + OCR）本身要 **~9 秒**，所以"全速"
  #      也就是 9 秒一轮；再快只能靠往上翻补读历史，那不是调这个数能解决的。
  adaptive_poll: true
  # ★ 2026-10-10（用户反馈「还是经常性漏消息」）：**爆发时不再白等**。
  #   上面那个 poll_interval 是「读完到下次读之间还要等多久」，而 full 档一轮读屏
  #   （截图 + OCR + 气泡分析）实测只要 **3.9 秒**（高清模式下 4.7 秒）—— 也就是说
  #   10 秒的间隔里有 **6 秒在干等**。这个值设成 0 = **读完立刻读下一轮**（只在
  #   「上一轮有新消息」时生效，群里一安静就按下面的 idle_steps 放慢）。
  #   实测爆发期周期 10 秒 → **约 4 秒（高清模式约 5 秒）**，读速约 2.4 倍。
  burst_interval: 0
  idle_step_rounds: 3          # 连续几轮没新消息往上爬一档
  idle_steps: [15, 25, 40]     # 空闲档位（秒）；最后一档 = 上限。
                              # ★ 2026-10-10 用户选 40（原来 60）—— 更不漏一点，少省一点电。
  # 发出前的拟人延迟（秒，区间）。2026-10-04 用户要求：看到消息后约 6 秒就发出去
  # （旧算法是 min_reply_gap/2 ~ max_reply_gap，实测 10~15 秒，太磨叽）。
  # 留空 / 注释掉 = 回退旧算法。想固定 6 秒就写 [6, 6]。
  # ★ 2026-10-09 同上：5~7 → **3~4** 秒。已经不像"秒回"（真人也会隔几秒），
  #   但比原来早 2~3 秒出手。
  reply_delay: [3, 4]
  # 夜间低峰慢速轮询。⚠️ 这是拿「漏消息」换电，不是拿「延迟」换电：机器人只能读到
  # 当前屏幕那一帧，间隔里刷过去的消息它**永远看不到**。
  # 窗口不是拍脑袋定的：2026-10-04 翻 12 屏聊天记录实测，群里是突发式 ——
  # 有消息的只有凌晨 0:35–2:39 和早上 7:45–8:26 两段，**2:39 到 7:45 整整 5 小时
  # 零消息**（微信超过 5 分钟没聊才会插时间线，所以没时间戳=真没人说话）。
  # ★ 2026-10-05 早改：用户 07:18 报「被 @ 了但没回复」—— 慢速段（当时到 07:45）
  #   每 10 分钟才读一屏，早上 6~7 点群里刷过去的 @ 就漏了（那次实测的作息已经变了）。
  #   按用户选择缩到 02:30–06:30：凌晨最冷的两小时仍省电，6:30 之后照常 20 秒一帧。
  # 留空 slow_poll_window = 不启用慢速，全天按上面的 poll_interval 跑。
  slow_poll_window: "02:30-06:30"
  slow_poll_interval: 600     # 慢速时段每 10 分钟一帧
  # 2026-10-04 从 20 降到 10：轮询已经 20 秒一帧，天然限流够强了，
  # 20 秒的下限只剩一个副作用 —— 挡掉「刚接一句又想补一句」。
  min_reply_gap: 3           # 两次回复之间的最小间隔（秒）
  max_reply_gap: 8           # 回复前随机等待的上限（秒）★ 仅 reply_delay 缺失时的回退
  per_minute: 6               # 每分钟最多回几条
  per_hour: 60                # 每小时上限
  per_day: 400                # 每天上限
  burst_limit: 5              # 一波消息最多连续回几条，防止刷屏（★ 别删：一轮可能看到多条消息）
  burst_window: 20            # "一波"的判定窗口（秒）
  # ★ 2026-10-05 用户要求：**被 @ 时无视"时间限制"，但还是不要刷屏**。
  #   true（默认）= "别人 @ 我"的那句回话豁免三个时间闸门：
  #                 静默时段 / min_reply_gap / burst_limit。
  #                 场景：群里几个人积极 @ 你，第二个、第三个人不该被
  #                 "距上次回复仅 3.2s" 或 "本波已连回 2 条" 挡掉、看着像装死。
  #   防刷屏的条数配额（per_minute / per_hour / per_day）**一条都不放**，
  #   所以就算被连番 @，也只是回得快一点，不会连珠炮，更不会烧穿配额。
  #   false = 退回老行为：@ 也照样被上面的时间闸门挡。
  mention_bypass: true
  # 静默时段（留空 = 全天不静默）。
  # 2026-10-03 用户要求：深夜 0-7 点要主动开口，而旧的 02:00-08:00 会把这段
  # 整个压掉，所以清空。想恢复就在下面加回一行，写法如 ["02:00-08:00"]。
  quiet_hours: []
  # ★ 只有这个时段内才「主动开口」（不需要被 @）；白天照旧被动回复。
  #   跨零点写法同 quiet_hours。留空 = 不限制时段。
  proactive_window: "00:00-24:00"    # ★2026-10-06 用户要求「更主动发消息」：全天自动发
  #   （原 00:00-07:00 = 白天只备稿、一个字都不发；改完全天都会自己开口）
  # 两次「主动开口」之间至少隔这么久（秒，随机取区间内）。用户要求保守，
  # 3~5 分钟一条；被 @ / 命中关键词的被动回复**不受**这个限制。
  proactive_gap: [20, 45]      # ★2026-10-06 [30,60] → [20,45]（主动接话更勤）
  # 零点定时文案允许发送的时间窗（防止 0 点整恰好读屏失败就整天不发了）
  midnight_window: "00:00-00:10"

# ---------------------------------------------------------------- 行为
behavior:
  reply_on_keyword: true      # 关键词命中就自动回（0 Token）
  reply_on_mention: true      # 被 @ 必回（走模型）
  proactive: true             # 随机对感兴趣的话题插话（走模型）★ 只在上面的窗口内
  proactive_chance: 0.55     # ★2026-10-06 0.18 → 0.3 → 0.55（用户「放开主动接话」；
  #   还要再乘 分数/阈值、上限 3 倍，所以 打分≥2 的话题基本必接）      # 每轮插话概率上限
  proactive_min_score: 1      # ★2026-10-06 2 → 1：门槛降一档，更多话题能过线
  # ★ 主动开口固定用哪套人设（不受 persona_mode 影响）。
  #   ★ 2026-10-10 晚：用户要求**回退到「猫娘」**（猫猫女仆只试了一天，他不要了）。
  #   切人设必须**两处一起改**（这里 + persona_schedule）—— 只改一处会出现
  #   「被动是猫娘、主动开口还是别人」的错位。
  proactive_catgirl: true
  proactive_catgirl_name: "猫娘"
  # 被 @ 的人名之外，这些词也当作"在跟我说话"
  extra_nicknames: []
  max_reply_chars: 40         # 模型回复超过这个长度就丢弃重来/截断（平时闲聊）
  # ★ 2026-10-09 用户原话：「被艾特的时候……一句话概括的话，他说的很没意思，
  #   你得展开讲讲，他才有意思，才能聊得下去，而不是一句话敷衍」。
  #   所以 @ 单独一档：平时仍然是 3~15 字的短句（人设的「轻轻一戳」不该被
  #   冲淡），只有**被点名问到**才允许展开。0 / 不写 = 沿用 max_reply_chars。
  mention_max_chars: 120      # 被 @ 时的成文上限（人设里写的是 100 字以内）
  # ★ 2026-10-09：主动插话也单独一档 —— 允许说两句、要有内容，但**不准硬凑**。
  #   三档对比：平时闲聊 40 / 主动插话 70 / 被 @ 点名 120。0 = 沿用 max_reply_chars。
  proactive_max_chars: 70     # 主动插话的成文上限
  # 人设怎么出场：random = 每次随机 / alternate = 严格轮流 / schedule = 按时段固定（推荐）
  # 人设文件放 personas/*.md（一个文件一个人设，按文件名排序）；目录为空就退回 persona.md
  persona_mode: schedule
  # ★ 2026-10-04 晚用户要求：贴吧老哥和猫娘**合并成一套人设**
  #   （personas/猫娘老哥.md：猫娘的壳 + 老哥的魂），并把「接黄梗」写进去
  #   （**只接不挑**：别人开车要接得住，自己不主动开）。
  #   原来 07:00-24:00 贴吧老哥 / 00:00-07:00 猫娘 的分时段取消 ——
  #   同一个人隔几条消息换一个性格反而假。两个老文件已改名成
  #   personas/*.md.bak-1004-merged 留着，想换回两套只需把名字改回来。
  #   persona_mode=schedule 时按这里的时段定人设：按顺序匹配，第一条命中的生效；
  #   逗号可并列多段，支持跨零点写法。
  persona_schedule:
    - window: "00:00-24:00"
      name: "猫娘"            # ★ 2026-10-10 晚：用户要求回退到猫娘（猫猫女仆试了一天
                              #   不要了；理由记在 personas/猫娘.md 的「说人话」
                              #   和「不写括号动作」两节）。
      # 想切猫猫女仆：这里和上面的 proactive_catgirl_name 一起改成 "猫猫女仆"，
      # 然后 `bash bot.sh start --restart`（meow_personas 里两个都有，不用动）。
  # 哪些人设说话带「喵」尾巴。**留空 / 注释掉 = 所有回复都加喵**（老行为）。
  # ★ 2026-10-10：放开成名单 —— 只有猫娘加「喵」，女仆不加（女仆自带的尾巴是
  #   「嘛 / 呢 / 哦」那种女仆腔）。判断在 bot.py::_persona_meows，
  #   _reply 和 _send_instant（零点文案 / 美图配文）两条路都走它。
  #   单测：test_persona_meow.py（14 项）。
  meow_personas: ["猫娘", "猫猫女仆"]
  # ⚠️ 当前只有一套人设（猫娘老哥），这一项**不生效**。
  #   想回到「两套人设各 50% 随机出场」：把 persona_mode 改成 random，
  #   再把 personas/ 下两个 *.md.bak-1004-merged 改回 *.md 就行（0.5 = 五五开）。
  persona_probability: 0.5
  send_key: button            # button = 点「发送」按钮；enter = 敲回车
  restore_focus: true         # 发完把焦点还给原来的窗口
  # 明显不该接的话题（省 Token，也避免惹事）
  # 软避雷：只拦住"主动插话"，别人直接 @ 你时仍然会回
  skip_keywords:
    - 加班
    - 开会
    - 工资
    # ★ 2026-10-07 用户要求：「cw 的组队的别回，给人添乱」——
    #   组队/找队友类消息一律**不主动插话**（人家在凑人，机器人搭话只会添乱）。
    #   ⚠️ 只拦"主动插话"这条路；被 @ 时照旧会回（那是 hard_skip_keywords 管的）。
    - "缺dps"
    - "缺奶"
    - "缺t"
    - "缺人"
    - "缺1"
    - "缺2"
    - "2=1"
    - "组队"
    - "求带"
    - "来奶"
    - "铁车"
    - "铜车"
    - "缺龙"
    - "缺素问"
  # 硬避雷：连被 @ 都不回。这里放你绝对不想让机器人开口的话题
  hard_skip_keywords:
    - 政治
    - 借钱
    - 转账
    - 赌博
    - 投资
    - 外挂
    - 代练
    - 开盒

# ---------------------------------------------------------------- 已删除的功能（存档）
# · 白天备稿（2026-10-05 加、后删）：机器人自己挑话题写草稿塞进 drafts.json，等你
#   在面板「实战台」里点发/改/不发 —— **功能已删除**，此处只留个记号。
# · 群内播报（2026-10-05 加、2026-10-06 按你要求删）：启动「喵来视奸你们了喵」、
#   停止「喵走了喵会想念你们的喵」，连同 wxauto/bot.py 的 _announce() 一起删了，
#   **启动/停止不再往群里说话**。想恢复看 bot.py.bak-1005-noannounce 与
#   config.yaml.bak-1005-noannounce。
# ★ 2026-10-08 审查清理：这两段原来有 26 行细节注释，讲的全是不存在的功能，
#   留着只会让人以为"改了会生效"，因此压缩成本段。

# ---------------------------------------------------------------- 群友发的照片（识图）
# ★ 2026-10-10 用户要求：「群里发照片他可以识别，然后能点评的他点评，或者他识别到
#   群友发了张美女照片，他点评一下」。
#
# 怎么走的：读屏时桥接把**图片消息从当帧截图上裁下来**（同一帧裁，坐标才不会漂，
# 见 wxbridge._crop_message_image）→ 机器人把这张图喂给视觉模型
# （llm.vision_model = deepseek-flash）→ 按人设（猫娘）点评一句 → 发群。
#
# 谁值得点评由模型自己判断：**实拍照片就点评；表情包、聊天截图、二维码、广告
# 海报、游戏界面这些只输出一个 ~（不说话）**。实测 7 张样本（3 张表情包 +
# 1 张梗图 + 1 张广告海报 + 2 张真人照）判定全对。
#
# ⚠️ 改这个段里的值要 `bash bot.sh start --restart` 重启机器人才生效。
image:
  enabled: true
  # ★ 2026-10-10 用户改口径：**主动识图关掉，改成"被 @ 让它看图的时候才识图"**。
  #   proactive: false（当前）= 它**不会**对群里随便发的照片开口；
  #     只有两种情况会识图：
  #       ① 有人 @ 它（或喊你的昵称）并且旁边有一张图 → 看图回答（走 @ 那条档位，
  #          字数上限用 behavior.mention_max_chars，跟其他被 @ 的回复一致）；
  #       ② 它自己（主人）发图 + 喊你的昵称→ 同样识图（共用一个微信号，能认到）。
  #   proactive: true = 恢复"自己看到照片就点评"，那时下面几个节流参数才生效。
  proactive: false
  # ↓ 以下四个只在 proactive: true 时起作用（主动点评的节流）
  # 两张点评之间至少隔多少秒（用户 2026-10-10 定：30 秒一张）
  cooldown_secs: 30
  # 每天最多点评几张（用户定的：一天 30 张）
  max_per_day: 30
  # ★ 同一个人发的图，多少秒内只点评一张。这不是防刷屏，是防**重复**：
  #   图片在屏幕上被新消息顶上去以后，裁出来的内容变了、指纹也跟着变，
  #   消息去重那层挡不住 —— 实测同一张图会被当成"新图"再点评一次。
  #   （静止不动的图不受影响：内容指纹一样，读屏层直接就认出来了。）
  sender_cooldown_secs: 300
  # 点评可以有多长。比平时聊天（40）宽一点 —— 看图说话要有细节，
  # 「说图里具体的东西」才不像复读机。
  reply_max_chars: 60
  # 喂给模型的输出上限，0 = 用 llm.vision_max_tokens
  max_tokens: 0

# ---------------------------------------------------------------- 群友发的PPT
# 2026-10-07 用户需求：群里有人把「瓜」做成 PPT 发出来（聊天记录里张三说过
#「没看PPT」）。机器人原来只把卡片上那行字 OCR 成普通文字，内容一点看不到。
# 现在：你在微信里点开那个 PPT → 文件落到微信目录 → 机器人取走抽文字 →
# 按人设点评一句发群（跟关键词回复 / 主动插话一个待遇）。
# 落点、解析、去重全在 wxauto/ppt.py；改这个段里的值要 bash bot.sh start 重启。
ppt:
  enabled: true
  # 只处理 mtime 落在这个窗口内（秒）的文件 —— 防止一开机把陈年旧文件全点评一遍
  fresh_secs: 900
  # mtime 距今不足这么多秒的当"还在写"，这一轮跳过、下一轮再看
  min_age_secs: 4
  # 文件大小上限（字节），超过的不碰
  max_bytes: 52428800
  # 喂给模型的文字上限（PPT 可能很长，超出截断）
  max_chars: 3000
  # 点评可以有多长。★ 2026-10-07 用户要求：「发吃瓜相关，信息量大，说的话可以
  # 长一点，不然别人看不懂」—— 所以单独给一档，比 behavior.max_reply_chars(40) 宽，
  # 并且允许它写多行（发送前会拼成一行）。
  reply_max_chars: 100
  # 两份点评之间至少隔多少秒。★ 2026-10-07 用户嫌 120 秒太长（"不是10s吗"）→ 10
  cooldown_secs: 10
  # 每天最多点评几份
  max_per_day: 8
  # ★ 2026-10-08 审查修复（C4）：扫落点的最小间隔（秒）。
  #   原来**每一轮**都跑一次 `adb shell find` 扫三个微信目录 —— 当前 12~20 秒
  #   一帧，没有 PPT 的时候也在白扫；adb 掉线时那次调用吃满 25 秒超时，会把
  #   读屏节奏从 12 秒拖到 37 秒（这期间群里的消息全漏）。落点不会秒级出现，
  #   60 秒扫一次足够；真有文件也只晚一轮被发现。调小=更灵敏更费电。
  scan_interval: 60
  # 吃瓜兴趣点（当期瓜词 / 自动学到的人名）的**保质期**，单位天。
  # ★ 2026-10-07 用户：「把这些名字写成有时效性的失效，一天或者两天不就行了
  #   吗？」—— 瓜热得快凉得也快，留太久只会拿过气的人名接话。默认 2 天。
  #   · 同一个瓜每次再出现（又发 PPT / 又有人做图）会**续期**，所以连着聊的
  #     瓜不会中途失效；
  #   · 想更短就改这里（0.5 = 12 小时），改完要 bash bot.sh start 重启。
  gua_ttl_days: 2

# ---------------------------------------------------------------- 读聊天记录
# ★ 2026-10-10：主人叫它「读一下这个聊天记录」时，机器人会点开屏幕上那张转发
#   卡片、读出全文、再按人设点评一句发群。
#   ⚠️ 这一步会**替主人点一下屏幕**（单击卡片 → 进详情页 → 再退出来），所以
#   只有主人自己喊它才走这条路（群友 @ 它不走，安全边界见
#   bot.py::_read_record_and_comment 与 wxbridge.py::read_record）。
record:
  enabled: true
  # 点评可以有多长 —— 聊天记录跟 PPT 一样信息量大，默认跟 ppt 那档齐平
  # （比 behavior.max_reply_chars=40 宽）；写成 0 就回落到 behavior 那一档。
  reply_max_chars: 100

# ---------------------------------------------------------------- 表情包
stickers:
  # 图片放在哪个文件夹（相对本目录）。
  # 里面的子文件夹名 = 标签，规则里写 image_tag: 开心 就只从 开心\ 里挑。
  # 想让它别发图，把 enabled 改成 false。
  enabled: true
  dir: 表情包

  # 同一个标签两次发送之间至少隔多少秒，防止一直刷图
  cooldown: 90

  # 最近发过的多少张之内不重复挑（避免连着发同一张）
  avoid_recent: 8

  # 图片粘进输入框后等多久再点发送（秒）。电脑卡就调大。
  settle: 1.6

# ---------------------------------------------------------------- 今日美图
# 2026-10-08 用户要求：群里有人发「今日美图」→ 机器人随机发一张美图，
# **每次触发都换一张**。规则本身在 rules.yaml（关键词 + action: meitu）。
meitu:
  enabled: true

  # 网络图源：分类名 -> 候选接口。每次触发先随机挑分类、再随机挑一条接口，
  # 所以想让它"每次都不一样"就多配几条（也避免某条接口挂了就彻底没图）。
  #
  # 2026-10-08 实测可用（容器直连，全部返回 200）：
  #   · t.alcy.cc/moe、t.alcy.cc/ycy                        → 二次元插画
  #   · pic.ltywl.top/mn/{api,pc,pe}.php                    → 真人写真（穿搭/人像，
  #     实测不是低俗图，但这是**第三方小站**，内容质量不可控，随时可能挂。
  #     三个变体是 api=自适应 pc=横图 pe=竖图，**同一个站** —— 站挂了真人源
  #     会一起挂，那时会自动退到本地图库/兜底话术）
  # ⚠️ 图源清一色返回 webp，微信「分享图片」通道不认 —— 代码会自动转 JPEG 再发。
  #
  # 比例是按**条数**平权随机的（这里 2 条二次元 : 3 条真人 = 约 40% : 60%）。
  # ★ 2026-10-08 用户选的是「更多真人：再加两条真人接口」→ 真人提到 3 条。
  # 想调比例就加减条目：
  #   · 让二次元回到 1/3 → 取消下面 loliapi 那行的注释（变成 3:3 = 50%）
  #   · 更多的二次元 → 下面 anosu 那条也能用（实测 200、817KB，是另一个站）
  sources:
    二次元:
      - https://t.alcy.cc/moe
      - https://t.alcy.cc/ycy
      # - https://www.loliapi.com/acg/     # 备选（加上就是 3:3）
      # - https://api.anosu.top/img        # 备选，另一个二次元站
    真人写真:
      - https://pic.ltywl.top/mn/api.php
      - https://pic.ltywl.top/mn/pc.php
      - https://pic.ltywl.top/mn/pe.php

  # 还要不要联网取图。false = 只发本地图库（完全离线，也就没有失败风险）
  use_network: true

  # 本地图库（相对本目录）：网络取不到时从这儿兜底；也可以只发这里的图。
  # 你自己往里丢 jpg/png/webp 都行，代码统一转成能发的 JPEG（顺手缩小）。
  local_dir: 美图库

  # 本地图集：名字 -> 目录。规则里写 `meitu_source: 看看腿` 就**只**从这个目录
  # 随机挑一张发、**不联网** —— 这类图集是用户自己一张张攒的，混进网图就串味了。
  #
  # ★ 2026-10-08 用户把图放在**手机相册**里（相册「看看腿」= 下面这个目录），
  #   所以这里直接指过去：他以后往相册里加图，机器人就自动有新图，
  #   不用再往项目目录搬一次。目录写绝对路径或相对本项目都行。
  #   ⚠️ 图集只有一两张时也照发（不会"发过一次就再也不发"），见 meitu.py
  #   里 _pick_from_dir 的 avoid 口径。
  #   ⚠️ 一个名字可以配**多个目录**（写成列表）。手机相册很容易变成
  #   「看看腿」+「看看腿_1」一对：ColorOS 建同名相册时会自动加后缀，而相册
  #   App 里两边都显示成「看看腿」，用户根本分不清自己加到了哪个。
  #   2026-10-08 就真发生了：配置指的那个被腾空（图进了回收站），20 张新图全在
  #   `看看腿_1` 里 —— 所以两个都配上，他加哪个都能发到。
  #   （回收站文件 `.trashed-*.jpg` 由 meitu.py 的 _is_junk() 过滤，不会发出去。）
  #   末尾那个 * 是**通配符**：看看腿 / 看看腿_1 / 看看腿_2… 会一起收进来，
  #   所以以后 ColorOS 再生成新后缀的相册，你不用管、也不用改配置。
  #   图集**随时可以新建**：配好名字以后，你把相册建出来、把图丢进去，
  #   机器人下一张就能读到，**不用重启**（目录是每次发图时才解析的）。
  local_sets:
    看看腿: "/sdcard/DCIM/MyAlbums/看看腿*"
    看看腹肌: "/sdcard/DCIM/MyAlbums/看看腹肌*"

  # 下载来的图放哪、留几张（超出按时间淘汰最旧的，别把手机存储吃满）
  cache_dir: 美图缓存
  keep_cached: 40

  # 单张下载超时 / 一次触发最多在网络上花多久 / 最多试几个接口。
  # ⚠️ budget 别调太大：读屏主循环 12~20 秒一帧，这里卡多久，群里就漏读多久。
  timeout: 12
  budget: 25
  max_tries: 3

  # 图片限制：单张上限 8MB；长边缩到 1600 再发（快得多）；JPEG 质量
  max_bytes: 8388608
  max_edge: 1600
  quality: 85

  # 两次美图之间至少隔多少秒。★ 你要的是"每次触发都换一张"，所以这条只防
  # 连点刷屏，别设太大。全局限速（per_minute / per_hour / per_day）另算。
  cooldown: 10

  # 最近发过的多少张之内不重复挑
  avoid_recent: 10

  # 网络和本地图库都没图时回一句话（留空 "" = 什么都不说）
  empty_reply: "呜 今天的美图博主跑路了喵"

  # ---- 主动发（2026-10-08 用户要求：「群友傻傻的不会触发」）----
  # 机器人**自己到点**往群里发一张美图，不需要任何人说话。
  # 跟关键词触发共用图源、冷却和 `_send_meitu`，只是触发的来源不同。
  auto:
    enabled: false          # ★ 2026-10-08 19:06 用户要求「不发了，取消吧」→ 关掉

    # 每天几点发（HH:MM，24 小时制，可以写多个）。
    # ★ 用户 2026-10-08 选的是「每天 1 次：12:00」。
    times: ["12:00"]

    # 到点后的发送窗口（分钟）：这期间没发成（读屏失败 / 被节流 / 群里正忙）
    # 后面几轮还会继续试；窗口过了就**当天不补**（跟零点文案一个口径）。
    # 轮询是 20 秒一帧，所以实际发出时间大约是 12:00:2x。
    window_min: 20

    # 每天最多主动发几张（防手滑把 times 写成重复项时刷屏）
    max_per_day: 1

    # 配文：发完图后随机抽一条跟着发（留空 captions: [] 就只发图不说话）。
    # 发送层会自动补「喵」（已以喵结尾的不会重复补），长度上限 behavior.max_reply_chars。
    # ★ 顺序是「先图后字」：万一图没发成，群里只会剩一句话而没有图，那看着像坏了；
    #   反过来只发出去一张图则完全正常。
    captions:
      - "今日美图来了喵"
      - "喏 今天的美图喵"
      - "今天的份 收好喵"
      - "随手发一张喵"

# ---------------------------------------------------------------- 安全阀
safety:
  # 全局热键，按一下**立刻**停止发送（进程还在，但不会再发任何东西）。
  # 写法：ctrl+alt+q / ctrl+shift+f12 / ...
  # 留空 "" 表示不用热键。
  #
  # 注意：这个组合可能已经被别的软件占了（实测这台机器上 ctrl+alt+q 就被占了），
  # 所以下面配了几个候补，启动时会自动挑第一个能注册上的。
  hotkey: ctrl+alt+q
  hotkey_fallbacks:
    - ctrl+alt+f9
    - ctrl+shift+f9
    - ctrl+alt+f10
    - ctrl+shift+f10

  # 这个文件一出现就立刻停止。适合脚本或远程急停。
  # 想停就在 wechat-auto 目录下新建一个 STOP.txt。
  # 留空 "" 表示不启用。
  stop_file: STOP.txt

  # 发完重读一次屏幕，确认自己那句话真的进了群。
  # ★ 2026-10-10 评审后默认改成 **false**：这个自检的结果**只用来打一行日志**
  #   （失败次数记在 `_verify_bad`，全项目没有任何消费者、也不再驱动熔断 ——
  #   2026-10-08 的 F1 修复就是把它降级成旁路信号）。而它每次要 `sleep(0.6)`
  #   再**跑一整帧截图 + OCR（实测 4~7 秒）**，这段时间主循环完全不读屏 ——
  #   评审实测：它是"每条消息多花 4 秒"的一份子（有一段 29 轮/903 秒 = 31 秒一轮）。
  #   日志里那 37 次「发送自检未通过」绝大多数是 OCR 抖动造成的假失败。
  #   要排障"发出去了但群里没看到"这类问题时，再临时打开。
  verify_send: false

  # 连续这么多次发送校验失败，就自动停止，避免在那儿死循环刷屏
  max_consecutive_failures: 3

# ---------------------------------------------------------------- 调试
debug:
  # 每轮把所有 OCR 结果打印出来（排查用，平时关掉）
  verbose: false
  # 有回复动作时保存当帧截图
  save_frames: false
  frame_dir: debug_frames
  # 记录每轮"没回/回了/为什么"
  log_decisions: true
  log_file: bot.log
  # ★ 2026-10-08 审查修复（M16）：日志级别与轮转。
  #   级别原来在代码里写死 DEBUG（5 天涨到 500 KB，日志里全是"不接（避雷词…）"
  #   这类细节）；文件也从来不会轮转（约 100 KB/天、36 MB/年）。
  #   现在：默认 INFO；想调解决策过程改成 DEBUG（会出现"不接（…）"那些行）。
  log_level: INFO
  # 单个日志文件上限；超过就轮转（bot.log → bot.log.1 → .2 → .3，最旧的丢）
  log_bytes: 2097152          # 2 MB
  log_backups: 3
  # 改 rules.yaml / persona.md 后自动重载，不用重启（config.yaml 里的
  # 频率、模型等设置仍需重启才生效）
  hot_reload: true

  # ⚠️ 以下三项在**手机端不生效**（只有 PC 版路径会读，保留是为了兼容 PC）：
  #   save_frames / frame_dir  —— 安卓发送走 AndroidSender，不存帧
  #   （另有 me.self_x_ratio、safety.hotkey*、behavior.send_key/restore_focus
  #     /stickers.settle/target.window_title 同理，见 审查报告-20261008.md §二）

# ============================================================================
# ★ 2026-10-09（用户：「我想让这个机器人更智能一点，可以让它帮我干点事情」，
#   随后点破「让机器人直接调用你的模型不就行了吗？」）：
#   主人喊它办事（「帮我查查…」「那句原话是什么」）时，把活儿转给
#   **DSH 的 headless agent**（`dsh --profile headless`，带真搜索/读网页/跑命令的
#   全套工具），再把它给的结果发回群里。
#   ⚠️ 只有主人自己（他自己在群里喊你的昵称）能触发 —— 群友 @ 它不走 agent；
#      外面还套了硬约束（只查资料、禁改文件、禁碰手机）和超时。
agent:
  enabled: true
  timeout: 180          # 秒：单件活儿最多等这么久，超时就退回普通回复
  max_per_day: 20       # 每天最多转几件（落盘计数，重启不清零）
  auto: true            # ★ 让它自己判断"这条我办不办得动"，办不动才转 agent（false = 只认触发词）
  ack: "本喵去查查 稍等喵"   # 办事前先应一声（留空 = 不吭声，直接闷头查）
  reply_max_chars: 220  # agent 的答复最长发多少字
  # 只有消息里出现这些词，才当成"办事请求"（否则还是普通聊天）
  triggers: ["帮我", "查一下", "查查", "搜一下", "搜搜", "帮我查", "帮我搜", "帮我看看",
             "帮我办", "帮我做", "找找", "原话", "出自哪", "考据", "查证"]

# ★ 2026-10-11：机器人记忆库（记群里的人 / 梗，按相关性注入 user prompt）
#   数据文件由 memory_tool.py 维护；enabled: false 就完全不注入（等于没有记忆库）。
#   max_items / max_chars 是"每轮最多注入几条、总共多少字"，别调太大（那是每轮成本）。
memory:
  enabled: true
  file: 记忆库.json
  max_items: 6
  max_chars: 420
  # ★ 2026-10-12：向量召回补位（走本机 embed_server，见 embed_ctl.sh）。
  #   子串命中仍是主路；这里只补"没提名字但语义相关"的几条。
  #   ⚠️ 服务没起来/挂了会自动退回纯子串，**不影响回复**；不想要就改 false。
  vector: true
  # ★ 2026-10-15 用户要求「记忆库判据松一点」：0.55 → 0.45。
  #   本机实测（bge-small-zh，记忆库 12 条）：相关查询 0.44~0.56、
  #   无关查询 ≤0.41；0.55 会把「谁总说想多了」（张三，0.49）这类
  #   正确召回一起挡掉。
  vector_min: 0.45
  # ★ 2026-10-11：自动整理 —— 每天一次，把最近 24h 群聊交给模型，学 ≤5 条「人 / 梗」
  #   跑没跑过记在 记忆_auto.json（成功失败都记）；关掉就 enabled: false。
  auto:
    enabled: true
    hours: 24
    max_items: 5

# ★ 2026-10-12：群情摘要（借鉴 AstrBot 的「自动上下文压缩」）
#   为什么需要：上下文只看最近 16 条 / 10 分钟（见 context_window_secs），
#   昨天那场瓜的结论、群里正在延续的事，机器人都不知道。
#   做法：每 interval_secs 把「这一段**新增的原始流水**」压成一小段存进
#   群情摘要.json，注入时取最近 inject_segments 段。
#   ⚠️ 刻意**不递归摘要**（不拿上一次的摘要再喂进去）—— 否则错一次会一直错下去，
#     而且越滚越抽象。旧段到期直接丢，不做二次压缩。
summary:
  enabled: true
  interval_secs: 3600     # 多久攒一段（秒）
  min_msgs: 20            # 这一段少于这么多条就不值得花一次调用
  max_chars: 240          # 每段摘要的字数上限
  keep_segments: 12       # 文件里最多留几段（12 段 ≈ 半天）
  inject_segments: 2      # 每轮注入最近几段（别调大，那是每轮成本）
  inject_chars: 400       # 注入总字数上限
  # ★ 2026-10-15 加：模型没给出可用摘要时，多久后才允许再试一次（秒）。
  #   原来失败不推进 last_to，结果主循环每轮（4 秒）都重试 —— 实测一天刷了
  #   1742 次失败调用。默认 300 秒；想更保守就调大。
  retry_cooldown_secs: 300

# ★ 2026-10-12：工具层（wxauto/tools.py）—— 让模型自己决定"这件事谁来办"。
#   现在表里有 self（自己回）/ meme（发表情包）/ agent（交给后台 agent）。
#   meme 带冷却与每日配额，且**只对主人自己发的话开放**（群友 @ 不走）。
#   关掉就完全不路由（回到纯 compose，一分钱不多花）。
tools:
  enabled: true
